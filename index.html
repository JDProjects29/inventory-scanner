<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    color: #fff;
    min-height: 100vh;
    background-image: url('https://lh3.googleusercontent.com/d/1qWOUjgedEEOdzldBypFmJWB1Ghgr8kAU');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }
  .topbar {
    background: #000;
    padding: 18px 10px;
    border-bottom: 3px solid #d4af37;
  }
  .topbar h1 {
    color: #d4af37;
    margin: 0;
    font-size: 24px;
    letter-spacing: 1px;
  }
  .container {
    max-width: 400px;
    margin: 25px auto;
    background: rgba(0, 0, 0, 0.65);
    border: 1px solid #d4af37;
    border-radius: 14px;
    padding: 25px 18px;
  }
  input#barcode {
    font-size: 20px;
    padding: 10px;
    width: 85%;
    max-width: 240px;
    text-align: center;
    border-radius: 8px;
    border: none;
    margin-bottom: 10px;
  }
  button {
    font-size: 16px;
    padding: 12px 18px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
  }
  .add { background-color: #2e7d32; }
  .remove { background-color: #c62828; }
  .camera { background-color: #1565c0; }
  .mode { background-color: #d4af37; color: #000; font-weight: bold; }
  .submit { background-color: #d4af37; color: #000; font-weight: bold; }
  .clear { background-color: #444; }
  #result { margin-top: 15px; font-size: 16px; font-weight: bold; min-height: 22px; }
  #reader { width: 260px; margin: 15px auto; border-radius: 10px; overflow: hidden; }
  table { margin: 15px auto 0; border-collapse: collapse; width: 100%; background: #fff; border-radius: 10px; overflow: hidden; }
  th { background: #000; color: #d4af37; padding: 8px; font-size: 14px; }
  td { padding: 8px; color: #222; border-bottom: 1px solid #eee; font-size: 14px; }
  .removeRow { color: #c62828; cursor: pointer; font-weight: bold; font-size: 20px; }
  .stepper { width: 32px; height: 32px; font-size: 20px; border-radius: 6px; background: #455a64; color: white; cursor: pointer; }
  .qtyInput { width: 55px; text-align: center; font-size: 16px; margin: 0 5px; padding: 5px 0; border-radius: 6px; border: 1px solid #ccc; }
  #bulkActionLabel { color: #d4af37; font-size: 16px; }
  #bulkSection { display: none; margin-top: 8px; }
  #instantButtons { margin-top: 5px; }
</style>
</head>
<body>
  <div class="topbar"><h1>Inventory Scanner</h1></div>

  <div class="container">
    <button class="mode" id="modeBtn" onclick="toggleMode()">Switch to Bulk Mode</button>

    <br><br>
    <input type="text" id="barcode" placeholder="Scan or type barcode" autofocus>

    <div id="instantButtons">
      <br>
      <button class="add" onclick="handleScan('add')">ADD (+1)</button>
      <button class="remove" onclick="handleScan('remove')">REMOVE (-1)</button>
    </div>

    <br>
    <button class="camera" id="cameraBtn" onclick="toggleCamera()">📷 Scan with Camera</button>
    <div id="reader"></div>
    <div id="result"></div>

    <div id="bulkSection">
      <h3 id="bulkActionLabel">Currently: ADDING items</h3>
      <button class="add" onclick="setBulkAction('add')">Set to ADD</button>
      <button class="remove" onclick="setBulkAction('remove')">Set to REMOVE</button>
      <table id="bulkTable">
        <tr><th>Barcode</th><th>Quantity</th><th></th></tr>
      </table>
      <br>
      <button class="submit" onclick="submitBulk()">Submit All</button>
      <button class="clear" onclick="clearBulk()">Clear List</button>
    </div>
  </div>

  <script>
    // PASTE YOUR APPS SCRIPT WEB APP URL BELOW (from Part 7b)
    const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbw8MilQ1PiIVsqVlA-JViD631rZqcLBtGfPRymWQ9cU8idvOxlhn1eYF6vcms9i4tsl/exec';

    let bulkMode = false;
    let bulkAction = 'add';
    let bulkItems = {};
    let lastScanCode = '';
    let lastScanTime = 0;

    document.getElementById('barcode').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        handleScan(bulkMode ? bulkAction : 'add');
      }
    });

    function toggleMode() {
      bulkMode = !bulkMode;
      document.getElementById('bulkSection').style.display = bulkMode ? 'block' : 'none';
      document.getElementById('instantButtons').style.display = bulkMode ? 'none' : 'block';
      document.getElementById('modeBtn').innerText = bulkMode ? 'Switch to Instant Mode' : 'Switch to Bulk Mode';
      document.getElementById('result').innerText = bulkMode
        ? 'Bulk mode on: scans are added to the list below.'
        : 'Instant mode on: each scan updates Smartsheet right away.';
    }

    function setBulkAction(action) {
      bulkAction = action;
      document.getElementById('bulkActionLabel').innerText = 'Currently: ' + (action === 'add' ? 'ADDING items' : 'REMOVING items');
    }

    function handleScan(action) {
      const barcode = document.getElementById('barcode').value.trim();
      document.getElementById('barcode').value = '';
      document.getElementById('barcode').focus();
      if (!barcode) return;

      if (bulkMode) {
        const step = action === 'add' ? 1 : -1;
        bulkItems[barcode] = (bulkItems[barcode] || 0) + step;
        renderBulkTable();
        document.getElementById('result').innerText = 'Scanned: ' + barcode;
      } else {
        sendToServer([{ barcode: barcode, delta: action === 'add' ? 1 : -1 }], true);
      }
    }

    // Scanning the same barcode again just bumps its quantity by 1 automatically.
    // You can also edit the number directly, or use the − / + buttons, or delete the row entirely.
    function renderBulkTable() {
      const table = document.getElementById('bulkTable');
      table.innerHTML = '<tr><th>Barcode</th><th>Quantity</th><th></th></tr>';
      Object.keys(bulkItems).forEach(function(bc) {
        const qty = bulkItems[bc];
        const row = table.insertRow();
        row.insertCell(0).innerText = bc;

        const qtyCell = row.insertCell(1);
        qtyCell.innerHTML =
          '<button class="stepper" onclick="adjustQty(\'' + bc + '\', -1)">−</button>' +
          '<input type="number" class="qtyInput" value="' + qty + '" onchange="setQty(\'' + bc + '\', this.value)">' +
          '<button class="stepper" onclick="adjustQty(\'' + bc + '\', 1)">+</button>';

        const delCell = row.insertCell(2);
        delCell.innerHTML = '<span class="removeRow" onclick="removeBulkItem(\'' + bc + '\')">✕</span>';
      });
    }

    function adjustQty(bc, amount) {
      bulkItems[bc] = (bulkItems[bc] || 0) + amount;
      renderBulkTable();
    }

    function setQty(bc, value) {
      const n = parseInt(value, 10);
      bulkItems[bc] = isNaN(n) ? 0 : n;
    }

    function removeBulkItem(bc) {
      delete bulkItems[bc];
      renderBulkTable();
    }

    function clearBulk() {
      bulkItems = {};
      renderBulkTable();
      document.getElementById('result').innerText = 'List cleared.';
    }

    function submitBulk() {
      const items = Object.keys(bulkItems).map(function(bc) {
        return { barcode: bc, delta: bulkItems[bc] };
      });
      if (items.length === 0) {
        document.getElementById('result').innerText = 'Nothing to submit.';
        return;
      }
      sendToServer(items, false);
    }

    function sendToServer(items, isInstant) {
      document.getElementById('result').innerText = 'Working...';
      fetch(WEBAPP_URL, {
        method: 'POST',
        body: JSON.stringify({ items: items })
      })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (!data.success) {
            document.getElementById('result').innerText = 'Error: ' + data.message;
            return;
          }
          const summary = data.results.map(function(r) { return r.message; }).join(' | ');
          document.getElementById('result').innerText = summary;
          if (!isInstant) {
            bulkItems = {};
            renderBulkTable();
          }
        })
        .catch(function(err) {
          document.getElementById('result').innerText = 'Error: ' + err.message;
        });
    }

    let html5QrCode;
    let cameraRunning = false;

    function toggleCamera() {
      if (cameraRunning) { stopCamera(); } else { startCameraInternal(); }
    }

    function stopCamera() {
      if (html5QrCode) {
        html5QrCode.stop().then(function() {
          cameraRunning = false;
          document.getElementById('reader').innerHTML = '';
          document.getElementById('cameraBtn').innerText = '📷 Scan with Camera';
        });
      }
    }

    function startCameraInternal() {
      cameraRunning = true;
      document.getElementById('cameraBtn').innerText = '⏹ Stop Camera';
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 200 },
        function(decodedText) {
          const now = Date.now();
          if (decodedText === lastScanCode && now - lastScanTime < 2000) return; // avoid double-counting the same scan
          lastScanCode = decodedText;
          lastScanTime = now;
          document.getElementById('barcode').value = decodedText;
          handleScan(bulkMode ? bulkAction : 'add');
          if (!bulkMode) { stopCamera(); } // in instant mode, stop after one scan; in bulk mode, keep scanning
        }
      );
    }
  </script>
</body>
</html>
