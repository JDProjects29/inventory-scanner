<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    color: #fff;
    min-height: 100vh;
    background-image: url('https://lh3.googleusercontent.com/d/1qWOUjgedEEOdzldBypFmJWB1Ghgr8kAU');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }
  .topbar {
    background: #000;
    padding: 14px 10px;
    border-bottom: 3px solid #d4af37;
  }
  .topbar h1 {
    color: #d4af37;
    margin: 0;
    font-size: clamp(18px, 5.5vw, 24px);
    letter-spacing: 1px;
  }
  .container {
    width: 94vw;
    max-width: 400px;
    margin: 18px auto;
    background: rgba(0, 0, 0, 0.68);
    border: 1px solid #d4af37;
    border-radius: 14px;
    padding: 18px 12px;
  }
  input#barcode {
    font-size: 18px;
    padding: 10px;
    width: 90%;
    max-width: 260px;
    text-align: center;
    border-radius: 8px;
    border: none;
    margin-bottom: 8px;
  }
  button {
    font-size: 14px;
    padding: 10px 14px;
    margin: 4px;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
  }
  button.small { font-size: 13px; padding: 8px 10px; margin: 3px; }
  .btnRow { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin: 4px 0; }
  .add { background-color: #2e7d32; }
  .remove { background-color: #c62828; }
  .update { background-color: #ef6c00; font-weight: bold; }
  .camera { background-color: #1565c0; }
  .mode { background-color: #d4af37; color: #000; font-weight: bold; }
  .submit { background-color: #d4af37; color: #000; font-weight: bold; }
  .clear { background-color: #444; }
  #result { margin-top: 14px; font-size: 12px; font-weight: normal; min-height: 22px; word-break: break-word; text-align: left; white-space: pre-line; }
  #reader { width: 100%; max-width: 260px; margin: 12px auto; border-radius: 10px; overflow: hidden; }
  #instantActionLabel, #bulkActionLabel { color: #d4af37; font-size: 14px; margin: 6px 0; }
  #instantQtyRow { display: none; margin-top: 6px; align-items: center; justify-content: center; gap: 6px; }
  #instantQty { width: 90px; text-align: center; font-size: 16px; padding: 8px 4px; border-radius: 6px; border: 1px solid #ccc; }

  .tableWrap { overflow-x: auto; margin-top: 12px; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; min-width: 260px; background: #fff; border-radius: 10px; overflow: hidden; }
  th { background: #000; color: #d4af37; padding: 6px 4px; font-size: 12px; }
  td { padding: 6px 4px; color: #222; border-bottom: 1px solid #eee; font-size: 12px; }
  .modeTag { font-size: 9px; color: #888; line-height: 1.2; }
  .itemName { font-size: 11px; color: #444; font-weight: bold; line-height: 1.2; }
  .removeRow { color: #c62828; cursor: pointer; font-weight: bold; font-size: 18px; padding: 0 4px; }
  .stepper { width: 26px; height: 26px; font-size: 16px; border-radius: 6px; background: #455a64; color: white; cursor: pointer; padding: 0; margin: 0 2px; }
  .qtyInput { width: 44px; text-align: center; font-size: 14px; margin: 0 2px; padding: 4px 0; border-radius: 6px; border: 1px solid #ccc; }

  #bulkSection { display: none; margin-top: 8px; }
  #instantButtons { margin-top: 5px; }
</style>
</head>
<body>
  <div class="topbar"><h1>Inventory Scanner</h1></div>

  <div class="container">
    <button class="mode" id="modeBtn" onclick="toggleMode()">Switch to Instant Mode</button>

    <br><br>
    <input type="text" id="barcode" placeholder="Scan or type barcode" autofocus>

    <div id="instantButtons" style="display:none;">
      <div class="btnRow">
        <button class="update small" onclick="setInstantAction('update')">Set to UPDATE QTY</button>
        <button class="add small" onclick="setInstantAction('add')">Set to ADD</button>
        <button class="remove small" onclick="setInstantAction('remove')">Set to REMOVE</button>
      </div>
      <div id="instantActionLabel">Currently: ADDING items (+1 per scan)</div>
      <div id="instantQtyRow">
        <input type="number" id="instantQty" placeholder="Exact qty" inputmode="numeric">
        <button class="submit small" onclick="submitInstantUpdate()">Set</button>
      </div>
    </div>

    <br>
    <button class="camera" id="cameraBtn" onclick="toggleCamera()">📷 Scan with Camera</button>
    <div id="reader"></div>

    <div id="bulkSection" style="display:block;">
      <h3 id="bulkActionLabel">Currently: ADDING items</h3>
      <div class="btnRow">
        <button class="update small" onclick="setBulkAction('update')">Set to UPDATE QTY</button>
        <button class="add small" onclick="setBulkAction('add')">Set to ADD</button>
        <button class="remove small" onclick="setBulkAction('remove')">Set to REMOVE</button>
      </div>
      <div class="tableWrap">
        <table id="bulkTable">
          <tr><th>Barcode</th><th>Quantity</th><th></th></tr>
        </table>
      </div>
      <br>
      <button class="submit" onclick="submitBulk()">Submit All</button>
      <button class="clear" onclick="clearBulk()">Clear List</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    // PASTE YOUR APPS SCRIPT WEB APP URL BELOW
    const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbw8MilQ1PiIVsqVlA-JViD631rZqcLBtGfPRymWQ9cU8idvOxlhn1eYF6vcms9i4tsl/exec';

    let bulkMode = true;         // bulk mode is the default
    let bulkAction = 'add';       // 'add' | 'remove' | 'update'
    let instantAction = 'add';    // 'add' | 'remove' | 'update'
    // bulkItems stores { qty: number, mode: 'delta' | 'absolute' }
    let bulkItems = {};
    let lastScanCode = '';
    let lastScanTime = 0;
    let itemDirectory = {}; // { "BARCODE": "Item Name" }

    function loadDirectory() {
      fetch(WEBAPP_URL + '?action=directory')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data.success) {
            itemDirectory = data.directory || {};
            renderBulkTable(); // refresh in case names arrived after some scans
          }
        })
        .catch(function() { /* names are a nice-to-have; scanning still works without them */ });
    }
    loadDirectory();

    function itemNameFor(bc) {
      return itemDirectory[bc] || '';
    }

    document.getElementById('barcode').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleScan(bulkMode ? bulkAction : instantAction, false);
      }
    });

    document.getElementById('instantQty').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitInstantUpdate();
      }
    });

    function toggleMode() {
      bulkMode = !bulkMode;
      document.getElementById('bulkSection').style.display = bulkMode ? 'block' : 'none';
      document.getElementById('instantButtons').style.display = bulkMode ? 'none' : 'block';
      document.getElementById('modeBtn').innerText = bulkMode ? 'Switch to Instant Mode' : 'Switch to Bulk Mode';
      document.getElementById('result').innerText = bulkMode
        ? 'Bulk mode on: scans are added to the list below.'
        : 'Instant mode on: each scan updates Smartsheet right away.';
    }

    // ----- Bulk mode -----
    function setBulkAction(action) {
      bulkAction = action;
      const label = action === 'add' ? 'ADDING items' : action === 'remove' ? 'REMOVING items' : 'UPDATING QTY (exact set)';
      document.getElementById('bulkActionLabel').innerText = 'Currently: ' + label;
    }

    // ----- Instant mode -----
    function setInstantAction(action) {
      instantAction = action;
      const label = action === 'add' ? 'ADDING items (+1 per scan)' : action === 'remove' ? 'REMOVING items (-1 per scan)' : 'UPDATING QTY (exact set)';
      document.getElementById('instantActionLabel').innerText = 'Currently: ' + label;
      document.getElementById('instantQtyRow').style.display = action === 'update' ? 'flex' : 'none';
    }

    function handleScan(action, fromCamera) {
      const barcode = document.getElementById('barcode').value.trim();
      if (!barcode) return;

      if (action === 'update' && !bulkMode) {
        // Instant update mode: keep barcode visible, move focus to the qty box below
        // (skip auto-focus for camera scans so the keyboard doesn't pop up)
        document.getElementById('instantQty').value = '';
        if (!fromCamera) {
          document.getElementById('instantQty').focus();
        } else {
          document.getElementById('instantQty').blur();
          document.getElementById('barcode').blur();
        }
        document.getElementById('result').innerText = 'Enter exact quantity for ' + barcode + ' below.';
        return;
      }

      document.getElementById('barcode').value = '';
      if (!fromCamera) {
        document.getElementById('barcode').focus();
      } else {
        document.getElementById('barcode').blur();
      }

      if (bulkMode) {
        if (action === 'update') {
          // Add directly to the list as an editable "SET TO" row — no popup
          const existing = bulkItems[barcode];
          bulkItems[barcode] = { qty: (existing && existing.mode === 'absolute') ? existing.qty : 0, mode: 'absolute' };
        } else {
          const step = action === 'add' ? 1 : -1;
          const existing = bulkItems[barcode];
          const base = (existing && existing.mode === 'delta') ? existing.qty : 0;
          bulkItems[barcode] = { qty: base + step, mode: 'delta' };
        }
        renderBulkTable();
        const scanName = itemNameFor(barcode);
        document.getElementById('result').innerText = 'Scanned: ' + barcode + (scanName ? ' — ' + scanName : '');
      } else {
        sendToServer([{ barcode: barcode, delta: action === 'add' ? 1 : -1 }], true);
      }
    }

    function submitInstantUpdate() {
      const barcode = document.getElementById('barcode').value.trim();
      const qtyVal = document.getElementById('instantQty').value;
      if (!barcode) {
        document.getElementById('result').innerText = 'Scan or type a barcode first.';
        return;
      }
      const n = parseInt(qtyVal, 10);
      if (isNaN(n)) {
        document.getElementById('result').innerText = 'Enter a valid number.';
        return;
      }
      document.getElementById('barcode').value = '';
      document.getElementById('instantQty').value = '';
      sendToServer([{ barcode: barcode, value: n }], true);
    }

    // Scanning the same barcode again just bumps its quantity by 1 automatically (add/remove modes).
    // You can also edit the number directly, or use the − / + buttons, or delete the row entirely.
    function renderBulkTable() {
      const table = document.getElementById('bulkTable');
      table.innerHTML = '<tr><th>Barcode</th><th>Quantity</th><th></th></tr>';
      Object.keys(bulkItems).forEach(function(bc) {
        const item = bulkItems[bc];
        const row = table.insertRow();
        const name = itemNameFor(bc);
        row.insertCell(0).innerHTML = bc +
          (name ? '<div class="itemName">' + name + '</div>' : '') +
          '<div class="modeTag">' + (item.mode === 'absolute' ? 'SET TO' : 'Δ CHANGE') + '</div>';

        const qtyCell = row.insertCell(1);
        qtyCell.innerHTML =
          '<button class="stepper" onclick="adjustQty(\'' + bc + '\', -1)">−</button>' +
          '<input type="number" inputmode="numeric" class="qtyInput" value="' + item.qty + '" onchange="setQty(\'' + bc + '\', this.value)">' +
          '<button class="stepper" onclick="adjustQty(\'' + bc + '\', 1)">+</button>';

        const delCell = row.insertCell(2);
        delCell.innerHTML = '<span class="removeRow" onclick="removeBulkItem(\'' + bc + '\')">✕</span>';
      });
    }

    function adjustQty(bc, amount) {
      bulkItems[bc].qty = (bulkItems[bc].qty || 0) + amount;
      renderBulkTable();
    }

    function setQty(bc, value) {
      const n = parseInt(value, 10);
      bulkItems[bc].qty = isNaN(n) ? 0 : n;
    }

    function removeBulkItem(bc) {
      delete bulkItems[bc];
      renderBulkTable();
    }

    function clearBulk() {
      bulkItems = {};
      renderBulkTable();
      document.getElementById('result').innerText = 'List cleared.';
    }

    function submitBulk() {
      const items = Object.keys(bulkItems).map(function(bc) {
        const item = bulkItems[bc];
        return item.mode === 'absolute'
          ? { barcode: bc, value: item.qty }
          : { barcode: bc, delta: item.qty };
      });
      if (items.length === 0) {
        document.getElementById('result').innerText = 'Nothing to submit.';
        return;
      }
      sendToServer(items, false);
    }

    function sendToServer(items, isInstant) {
      document.getElementById('result').innerText = 'Working...';
      fetch(WEBAPP_URL, {
        method: 'POST',
        body: JSON.stringify({ items: items })
      })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (!data.success) {
            document.getElementById('result').innerText = 'Error: ' + data.message;
            return;
          }
          const summary = 'Items Updated:\n\n' + data.results.map(function(r) { return '• ' + r.message; }).join('\n');
          document.getElementById('result').innerText = summary;
          if (!isInstant) {
            bulkItems = {};
            renderBulkTable();
          }
        })
        .catch(function(err) {
          document.getElementById('result').innerText = 'Error: ' + err.message;
        });
    }

    let html5QrCode;
    let cameraRunning = false;

    function toggleCamera() {
      if (cameraRunning) { stopCamera(); } else { startCameraInternal(); }
    }

    function stopCamera() {
      if (html5QrCode) {
        html5QrCode.stop().then(function() {
          cameraRunning = false;
          document.getElementById('reader').innerHTML = '';
          document.getElementById('cameraBtn').innerText = '📷 Scan with Camera';
        });
      }
    }

    function startCameraInternal() {
      cameraRunning = true;
      document.getElementById('cameraBtn').innerText = '⏹ Stop Camera';
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 200 },
        function(decodedText) {
          const now = Date.now();
          if (decodedText === lastScanCode && now - lastScanTime < 2000) return; // avoid double-counting the same scan
          lastScanCode = decodedText;
          lastScanTime = now;
          document.getElementById('barcode').value = decodedText;
          const action = bulkMode ? bulkAction : instantAction;
          handleScan(action, true);
          document.activeElement && document.activeElement.blur();
          // In instant "update" mode, keep the camera running and let the user tap
          // into the qty box themselves; otherwise stop after one scan in instant mode.
          if (!bulkMode && action !== 'update') { stopCamera(); }
        }
      );
    }
  </script>
</body>
</html>
