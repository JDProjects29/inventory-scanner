<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  color: #fff;
  min-height: 100vh;
  background: #111;
}
.topbar {
  background: #000;
  padding: 18px 10px;
  border-bottom: 3px solid #d4af37;
}
.topbar h1 {
  color: #d4af37;
  margin: 0;
  font-size: 24px;
  letter-spacing: 1px;
}
.container {
  max-width: 400px;
  margin: 25px auto;
  background: rgba(0, 0, 0, 0.65);
  border: 1px solid #d4af37;
  border-radius: 14px;
  padding: 25px 18px;
}
input#barcode, input#setQtyValue {
  font-size: 20px;
  padding: 10px;
  width: 85%;
  max-width: 240px;
  text-align: center;
  border-radius: 8px;
  border: none;
  margin-bottom: 10px;
}
button {
  font-size: 16px;
  padding: 12px 18px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}
.add { background-color: #2e7d32; }
.remove { background-color: #c62828; }
.set { background-color: #d4af37; color: #000; font-weight: bold; }
.camera { background-color: #1565c0; }
.mode { background-color: #444; }
.submit { background-color: #d4af37; color: #000; font-weight: bold; }
.clear { background-color: #444; }
#result { margin-top: 15px; font-size: 16px; font-weight: bold; min-height: 24px; }
#reader { width: 260px; margin: 15px auto; border-radius: 10px; overflow: hidden; }
table { margin: 15px auto 0; border-collapse: collapse; width: 100%; background: #fff; }
th { background: #000; color: #d4af37; padding: 8px; font-size: 14px; }
td { padding: 8px; color: #222; border-bottom: 1px solid #eee; font-size: 14px; }
.removeRow { color: #c62828; cursor: pointer; font-weight: bold; font-size: 20px; }
.stepper { width: 32px; height: 32px; font-size: 20px; border-radius: 6px; border: none; }
.qtyInput { width: 55px; text-align: center; font-size: 16px; margin: 0 5px; }
#bulkActionLabel { color: #d4af37; font-size: 16px; }
#bulkSection { margin-top: 8px; }
#setQtyBlock { display: none; margin-top: 8px; }
#instantButtons { margin-top: 5px; }
.modeToggle button { opacity: 0.6; }
.modeToggle button.active { opacity: 1; box-shadow: 0 0 0 2px #fff; }
</style>
</head>
<body>
<div class="topbar"><h1>Inventory Scanner</h1></div>
<div class="container">
  <button class="mode" id="modeBtn" onclick="toggleMode()">Switch to Bulk Mode</button>
  <br><br>
  <input type="text" id="barcode" placeholder="Scan or type barcode" autofocus>

  <div id="instantButtons">
    <br>
    <button class="set" onclick="promptSetQty()">Update QTY</button>
    <button class="add" onclick="handleScan('add')">ADD (+1)</button>
    <button class="remove" onclick="handleScan('remove')">REMOVE (-1)</button>
  </div>

  <br>
  <button class="camera" id="cameraBtn" onclick="toggleCamera()">📷 Scan with Camera</button>
  <div id="reader"></div>
  <div id="result"></div>

  <div id="bulkSection" style="display:none;">
    <h3 id="bulkActionLabel">Currently: UPDATING QTY</h3>
    <div class="modeToggle">
      <button class="set active" id="setModeBtn" onclick="setBulkAction('set')">Update QTY</button>
      <button class="add" id="addModeBtn" onclick="setBulkAction('add')">Set to ADD</button>
      <button class="remove" id="removeModeBtn" onclick="setBulkAction('remove')">Set to REMOVE</button>
    </div>
    <table id="bulkTable">
      <tr><th>Barcode</th><th>Qty</th><th></th></tr>
    </table>
    <br>
    <button class="submit" onclick="submitBulk()">Submit All</button>
    <button class="clear" onclick="clearBulk()">Clear List</button>
  </div>
</div>

<script>
// PASTE YOUR APPS SCRIPT WEB APP URL BELOW (from Part 3) — leave as-is if this file
// is served directly by Apps Script (doGet), only needed for a separate GitHub Pages page.
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbw8MilQ1PiIVsqVlA-JViD631rZqcLBtGfPRymWQ9cU8idvOxlhn1eYF6vcms9i4tsl/exec';

let bulkMode = false;
let bulkAction = 'set'; // 'set' | 'add' | 'remove'  — default prioritizes Update QTY
let bulkItems = {}; // barcode -> { mode, value }

document.getElementById('barcode').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    if (bulkMode) {
      handleScan(bulkAction);
    } else {
      handleScan('add'); // Enter in instant mode still does a quick +1 by default
    }
  }
});

function toggleMode() {
  bulkMode = !bulkMode;
  document.getElementById('bulkSection').style.display = bulkMode ? 'block' : 'none';
  document.getElementById('instantButtons').style.display = bulkMode ? 'none' : 'block';
  document.getElementById('modeBtn').innerText = bulkMode ? 'Switch to Instant Mode' : 'Switch to Bulk Mode';
  document.getElementById('result').innerText = bulkMode
    ? 'Bulk mode on: scans are added to the list below.'
    : 'Instant mode on: each scan updates Smartsheet right away.';
}

function setBulkAction(action) {
  bulkAction = action;
  const labels = { set: 'UPDATING QTY', add: 'ADDING items', remove: 'REMOVING items' };
  document.getElementById('bulkActionLabel').innerText = 'Currently: ' + labels[action];
  ['setModeBtn','addModeBtn','removeModeBtn'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById(action + 'ModeBtn').classList.add('active');
}

// ---- INSTANT MODE ----

function handleScan(action) {
  const barcode = document.getElementById('barcode').value.trim();
  document.getElementById('barcode').value = '';
  document.getElementById('barcode').focus();
  if (!barcode) return;

  sendToServer([{ barcode: barcode, mode: action, delta: action === 'add' ? 1 : -1 }], true);
}

function promptSetQty() {
  const barcode = document.getElementById('barcode').value.trim();
  if (!barcode) {
    document.getElementById('result').innerText = 'Scan or type a barcode first.';
    return;
  }
  const value = prompt('Set exact quantity for ' + barcode + ':');
  if (value === null) return; // cancelled
  const num = parseInt(value, 10);
  if (isNaN(num)) {
    document.getElementById('result').innerText = 'Please enter a number.';
    return;
  }
  document.getElementById('barcode').value = '';
  document.getElementById('barcode').focus();
  sendToServer([{ barcode: barcode, mode: 'set', value: num }], true);
}

// ---- BULK MODE ----
// Scanning the same barcode again in ADD/REMOVE bumps quantity by 1.
// In Update QTY mode, scanning just adds it to the list at 0 — type the real count into the box.

function handleBulkScan() {
  const barcode = document.getElementById('barcode').value.trim();
  document.getElementById('barcode').value = '';
  document.getElementById('barcode').focus();
  if (!barcode) return;

  if (!bulkItems[barcode] || bulkItems[barcode].mode !== bulkAction) {
    bulkItems[barcode] = { mode: bulkAction, value: bulkAction === 'set' ? 0 : (bulkAction === 'add' ? 1 : -1) };
  } else if (bulkAction !== 'set') {
    bulkItems[barcode].value += (bulkAction === 'add' ? 1 : -1);
  }
  renderBulkTable();
  document.getElementById('result').innerText = 'Scanned: ' + barcode;
}

  const table =
